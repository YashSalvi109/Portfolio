<!doctype html>
<html lang="en-GB" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%SITE_TITLE%</title>
    <meta name="theme-color" content="#05070D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F8FC" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/profile.webp" type="image/webp" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />

    <!-- Apply saved theme before paint to avoid a flash. Dark is the default. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:sans-serif">Yash Salvi | Market Research &amp; Consumer Insights. Please enable JavaScript to view this site, or email yashssalvi@outlook.com.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
